function dots(imp) {
  let html = '<div class="imp-dots">';
  for (let i = 1; i <= 5; i++) {
    html += `<div class="dot ${i <= imp ? 'fill' : 'empty'}"></div>`;
  }
  html += '</div>';
  return html;
}

let html = '';
categories.forEach((cat, ci) => {
  const isOpen = cat.open ? 'open' : '';
  html += `
  <div class="section cat-${cat.key}">
    <div class="section-header" onclick="toggleSection(${ci})">
      <div class="section-title">
        <span>${cat.icon} ${cat.label}</span>
        <span class="badge">${cat.count}</span>
      </div>
      <span class="chevron ${isOpen}" id="chev-${ci}">▼</span>
    </div>
    <div class="section-body ${isOpen}" id="body-${ci}">
      <div class="divider"></div>
      <div class="sub-label">${cat.sub}</div>
      <div class="indicator-grid">
  `;
  cat.indicators.forEach(ind => {
    html += `
    <div class="indicator-card">
      ${dots(ind.imp)}
      <div class="ind-name">${ind.name}</div>
      <div class="ind-desc">${ind.desc}</div>
    </div>
    `;
  });
  html += `</div></div></div>`;
});

document.querySelector('.container').innerHTML = html;

function toggleSection(ci) {
  const body = document.getElementById('body-' + ci);
  const chev = document.getElementById('chev-' + ci);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}
